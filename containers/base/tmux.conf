# devbase 共通の tmux 既定設定 -> /etc/tmux.conf
#
# tmux は /etc/tmux.conf を読んでから ~/.tmux.conf を読む。同じオプションを両方が
# 設定した場合は後から読む ~/.tmux.conf が勝つため、ここは「既定値の配布」であり
# 個人設定を縛らない。
#
# tmux は起動時に端末の代替画面へ切り替わる。そのため出力履歴は VS Code などの
# 端末側スクロールバックではなく tmux 自身のバッファに入る。素の初期値のままでは
# その履歴へ実質的に手が届かないため、以下を既定にする。

# ホイール操作を tmux へ渡す。転がすと自動で copy-mode に入り履歴を遡れる。
# 選択してボタンを離せば OSC 52 でクリップボードへ入る (set-clipboard の既定は
# external)。ペインをまたいで選択したいときは Shift + ドラッグで端末側の選択に戻る。
set -g mouse on

# Windows の選択操作に近づける。ドラッグ終了時には選択を残し、Ctrl+C でコピーする。
# copy-mode 中も履歴上で新しい範囲をドラッグできるよう、選択開始操作を明示する。
unbind-key -T copy-mode MouseDragEnd1Pane
unbind-key -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode MouseDown1Pane select-pane
bind-key -T copy-mode-vi MouseDown1Pane select-pane
bind-key -T copy-mode MouseDrag1Pane select-pane \; send-keys -X begin-selection
bind-key -T copy-mode-vi MouseDrag1Pane select-pane \; send-keys -X begin-selection
bind-key -T copy-mode C-c send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-c send-keys -X copy-selection-and-cancel

# 既定の 2000 行はビルドログ 1 回で流れ切る。pane あたりの上限であり、実際に使った
# 分だけ確保するので固定の先取りは無い。
set -g history-limit 100000

# 端末の種別。tmux 3.6 の既定と同値だが、既定値は tmux の版で変わり得るので固定する。
# tmux-256color の terminfo は ncurses-base に含まれ、ubuntu:26.04 で解決できる。
set -g default-terminal "tmux-256color"

# 外側の端末が xterm-256color を名乗るとき (VS Code の統合ターミナル) に 24bit 色を
# 通す。-ga で追記し、tmux 既定の linux*:AX@ を潰さない。
set -ga terminal-overrides ",xterm-256color:Tc"

# 端末のフォーカスイン/アウト通知を tmux 内のアプリへ転送する。既定は off で、
# Claude Code はこれを検知して警告を出し、完了通知の出し分けが働かない。
set -g focus-events on
