[project]
name = "devbase"
version = "3.8.0"
description = "Docker-based Development Environment Manager"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pyrage>=1.2",
    "boto3>=1.34",
    "questionary>=2.1",
]

[dependency-groups]
dev = [
    "pyte>=0.8.2",
    "pytest>=8.0",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# 全体テストを CPU の数で並列に流す (#290)。直列に戻すときは -n 0
# loadgroup: xdist_group の印を付けたケースを同じワーカーへ寄せる (印の無いケースは load と同じ)
addopts = "-n auto --dist loadgroup"
pythonpath = ["lib"]

[tool.uv.sources]
