[project]
name = "devbase"
version = "2.2.0"
description = "Docker-based Development Environment Manager"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pyrage>=1.2",
    "boto3>=1.34",
    "simple-term-menu>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lib"]

[tool.uv.sources]
