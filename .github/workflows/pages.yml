name: Deploy installer to Pages

# install.sh を GitHub Pages (dl.basex.jp) で配信する。
# 配信仕様: docs/developer/installer-hosting.md
# リポジトリ全体は晒さず、install.sh と紹介ページ（site/）だけを成果物として公開する。

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Node.js 20 で動く JS アクションの deprecation 警告 (2026-06-16 以降は Node 24 が
# 既定) を回避するため、ランナーで Node 24 実行を強制する。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R site/. _site/              # 紹介ページ (https://dl.basex.jp/)
          cp install.sh _site/i            # 配信パス (https://dl.basex.jp/i)
          echo 'dl.basex.jp' > _site/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
